<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8f9fa] h-screen flex flex-col font-sans text-gray-800">

    <header class="p-4 flex items-center gap-3 bg-white shadow-sm">
        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center">
            <i class="fa-solid fa-asterisk text-yellow-400 text-lg"></i>
        </div>

        <h1 class="text-xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-500">Poly Agent</h1>
    </header>

    <main id="chat-window" class="flex-1 overflow-y-auto px-64 py-6 space-y-6 chat-container">
        <div class="max-w-3xl mx-auto text-center mt-20">
            <h2 class="text-4xl font-medium bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-red-500">
                Hello, I am Poly Agent,
            </h2>
            <p class="text-gray-500 mt-4">What can I do for you today? You can ask me anything!</p>
        </div>
    </main>

    <footer class="p-4 pb-8 bg-white border-t md:border-none md:bg-transparent">
        <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-lg border border-gray-200 p-2 flex flex-col">
            <div id="file-preview" class="px-4 py-2 hidden">
                <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full border border-blue-200" id="file-name"></span>
            </div>
            
            <div class="flex items-center space-x-2">
                <label class="p-3 cursor-pointer hover:bg-gray-100 rounded-full transition text-gray-500">
                    <i class="fa-solid fa-plus"></i>
                    <input type="file" id="file-input" class="hidden">
                </label>
                
                <input type="text" id="user-input" placeholder="Type your message..." 
                       class="flex-1 py-3 bg-transparent outline-none text-lg">
                
                <button id="send-btn" class="p-3 text-blue-600 hover:bg-blue-50 rounded-full transition">
                    <i class="fa-solid fa-paper-plane text-xl"></i>
                </button>
            </div>
        </div>
    </footer>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const fileInput = document.getElementById('file-input');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const filePreview = document.getElementById('file-preview');
        const fileNameSpan = document.getElementById('file-name');

        // 文件上传处理
        fileInput.onchange = async () => {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileNameSpan.innerText = file.name;
                filePreview.classList.remove('hidden');

                const formData = new FormData();
                formData.append('file', file);
                
                await fetch('http://localhost:8000/upload', { method: 'POST', body: formData });
            }
        };

        // 发送消息函数
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. 添加用户消息到界面
            appendMessage('user', text);
            userInput.value = '';
            filePreview.classList.add('hidden');

            // 2. 发送请求到后端
            const formData = new FormData();
            formData.append('message', text);

            try {
                const response = await fetch('http://localhost:8000/chat', { method: 'POST', body: formData });
                const data = await response.json();
                appendMessage('bot', data.reply);
            } catch (err) {
                appendMessage('bot', '抱歉，连接后端失败。');
            }
        }

        function appendMessage(role, text) {
            const isUser = role === 'user';
            const msgDiv = document.createElement('div');
            
            msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-center'} mb-4 w-full`;
            
            let content = text;
            if (!isUser) {
                content = marked.parse(text);
            }
            
            msgDiv.innerHTML = `
                <div class="${isUser ? 'max-w-[40%] bg-gray-200' : 'w-[60%] bg-white border border-gray-100'} px-4 py-2 rounded-2xl shadow-sm">
                    ${isUser ? '' : '<div class="font-bold mb-1 text-blue-600 text-sm">Poly Agent</div>'}
                    <div class="text-left ${isUser ? 'text-gray-800' : 'text-gray-700'} leading-relaxed">
                        ${content}
                    </div>
                </div>
            `;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }


        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
